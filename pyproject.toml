[project]
name = "pjsk-tts"
version = "1.0.0"
description = "PJSK Multi-speaker VITS TTS GUI"
requires-python = ">=3.13"
dependencies = [
  "Janome>=0.5",
  "PySide6",
  "SoundFile",
  "Unidecode>=1.3",
  "fastapi>=0.115",
  "loguru>=0.7",
  "numpy>=2",
  "pyopenjtalk>=0.4",
  "python-dotenv>=1.0",
  "torch",
  "uvicorn>=0.30",
]

[build-system]
requires = ["Cython>=3.0", "numpy>=2.0", "setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.setuptools]
packages = [
  "pjsk_tts",
  "pjsk_tts.text",
  "pjsk_tts.monotonic_align",
]
